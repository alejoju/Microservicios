# Deshabilitar seguridad
spring:
  security:
    enabled: false
  management:
    security:
      enabled: false
  
  # Configuración de base de datos para test
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  # JPA para test
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

# Logging
logging:
  level:
    org.springframework: ERROR
    org.hibernate: ERROR
    mx.com.adrian.demo: DEBUG  # Opcional: para ver logs de tu app