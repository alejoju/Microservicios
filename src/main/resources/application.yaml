spring:
  application:
    name: productos-api

  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
  
  sql:
    init:
      mode: always
      
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    
    
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}" # Toma de variable de entorno

  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:}
      profile: ${SPRING_CLOUD_CONFIG_PROFILE:PRODUCTOS-API-DEV}
      label: ${SPRING_CLOUD_CONFIG_LABEL:}

server:
  port: 8090

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    filter: true
  paths-to-exclude: /error
  override-with-generic-response: false
  
  
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000           # 1 hora
  refresh-expiration: 86400000  # 24 horas